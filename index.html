<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@exploiting</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='32' y='42' font-size='50' text-anchor='middle' fill='%23ff0000' font-family='Segoe UI,sans-serif' font-weight='800'%3Exp%3C/text%3E%3C/svg%3E">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body {
  font-family:'Segoe UI',system-ui,sans-serif;
  color:#ffffff;
  overflow:hidden;
  background:#000;
}
#bg, #bg video, #bg-tint {
  position:fixed; inset:-4px;
  width:calc(100% + 8px);
  height:calc(100% + 8px);
  object-fit:cover;
}
#bg { background-size:cover; background-position:center; filter:blur(2px); z-index:0; }
#bg-tint { background:rgba(0,0,0,0.48); z-index:1; inset:0; width:100%; height:100%; }
#enter {
  position:fixed; inset:0; z-index:100;
  background:rgba(0,0,0,.92);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:22px; letter-spacing:2px;
  cursor:pointer; user-select:none;
  transition:opacity .6s;
  animation:pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }
#enter.hidden { opacity:0; pointer-events:none; animation:none; }
#wrap {
  position:relative; z-index:2;
  height:100%; display:flex; align-items:center; justify-content:center;
  padding:20px; perspective:900px;
}
#card {
  width:min(420px, 92vw);
  background:rgba(10,8,16,0.55);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;
  padding:34px 28px;
  text-align:center;
  transition:transform .1s ease-out;
}
#avatar {
  width:96px; height:96px; border-radius:50%;
  object-fit:cover; margin-bottom:14px;
  border:3px solid #ff0000;
  box-shadow:0 0 25px #ff0000;
}
#name { font-size:26px; font-weight:800; }
#bio { color:#ffffff; opacity:.8; margin-top:8px; min-height:1.4em; font-size:15px; }
#bio .caret { display:inline-block; width:2px; background:#ff0000; animation:blink 1s steps(1) infinite; height:1em; vertical-align:-2px; }
@keyframes blink { 50%{opacity:0} }
#links { margin-top:22px; display:flex; flex-direction:column; gap:10px; }
.link-btn {
  display:flex; align-items:center; justify-content:center; gap:10px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.14);
  border-radius:14px;
  color:#ffffff; text-decoration:none;
  padding:12px; font-size:15px; font-weight:600;
  transition:transform .15s, background .15s, border-color .15s;
}
.link-btn:hover { transform:scale(1.04); background:rgba(255,255,255,.14); border-color:#ff0000; }
.link-btn svg { width:17px; height:17px; flex-shrink:0; }
#name { text-shadow:0 0 10px #ff0000, 0 0 28px #ff0000; }

#lanyard {
  margin-top:18px; display:none; align-items:center; gap:12px; text-align:left;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  padding:10px 14px;
}
#lanyard img { width:42px; height:42px; border-radius:8px; }
#ly-line1 { font-size:13px; font-weight:700; }
#ly-line2 { font-size:12px; opacity:.7; }
#status-dot {
  display:inline-block; width:10px; height:10px; border-radius:50%;
  background:#747f8d; margin-left:8px; vertical-align:middle;
}
#audio-ui {
  position:fixed; left:16px; bottom:16px; z-index:5;
  display:flex; align-items:center; gap:10px;
  background:rgba(10,8,16,.7); backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px; padding:8px 12px;
}
#audio-ui button { background:none; border:none; color:#ffffff; font-size:12px; opacity:.85; cursor:pointer; }
#audio-ui input[type=range] { width:90px; accent-color:#ff0000; }
#views {
  position:fixed; right:16px; bottom:16px; z-index:5;
  display:flex; align-items:center; gap:7px;
  font-size:13px; color:#ffffff; opacity:.85;
  background:rgba(10,8,16,.7); backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px; padding:7px 12px;
}
#views svg { width:15px; height:15px; }
.sparkle { position:fixed; pointer-events:none; z-index:50; font-size:12px; animation:spark .8s ease-out forwards; }
@keyframes spark { to { transform:translateY(20px) scale(0); opacity:0; } }
</style>
</head>
<body>
<div id="bg"></div>
<div id="bg-tint"></div>
<div id="enter"></div>
<div id="wrap">
  <div id="card">
    <img id="avatar" alt="avatar" style="display:none">
    <div id="name"></div>
    <div id="bio"></div>
    <div id="links"></div>
    <div id="lanyard">
      <img id="ly-art" alt="" style="display:none">
      <div><div id="ly-line1"></div><div id="ly-line2"></div></div>
    </div>
  </div>
</div>

const PREVIEW = false;
const ICONS = {"telegram":"\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M22 2L11 13\"/>\u003cpath d=\"M22 2l-7 20-4-9-9-4 20-7z\"/>\u003c/svg>","discord":"\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"/>\u003ccircle cx=\"9\" cy=\"12\" r=\".5\" fill=\"currentColor\"/>\u003ccircle cx=\"15\" cy=\"12\" r=\".5\" fill=\"currentColor\"/>\u003c/svg>","youtube":"\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003crect x=\"2\" y=\"5\" width=\"20\" height=\"14\" rx=\"4\"/>\u003cpath d=\"M10 9l5 3-5 3z\" fill=\"currentColor\" stroke=\"none\"/>\u003c/svg>","tiktok":"\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18V5l12-2v13\"/>\u003ccircle cx=\"6\" cy=\"18\" r=\"3\"/>\u003ccircle cx=\"18\" cy=\"16\" r=\"3\"/>\u003c/svg>","instagram":"\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003crect x=\"2\" y=\"2\" width=\"20\" height=\"20\" rx=\"5\"/>\u003cpath d=\"M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z\"/>\u003cline x1=\"17.5\" y1=\"6.5\" x2=\"17.51\" y2=\"6.5\"/>\u003c/svg>","x":"\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M4 4l16 16\"/>\u003cpath d=\"M20 4L4 20\"/>\u003c/svg>","spotify":"\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// background
const bg = document.getElementById("bg");
if (CFG.bgType === "color") bg.style.background = CFG.bgColor1;
else if (CFG.bgType === "gradient") bg.style.background = "linear-gradient(135deg," + CFG.bgColor1 + "," + CFG.bgColor2 + ")";
else if (CFG.bgType === "image" && CFG.bgUrl) bg.style.backgroundImage = "url('" + CFG.bgUrl.replace(/'/g, "%27") + "')";
else if (CFG.bgType === "video" && CFG.bgUrl) {
  const v = document.createElement("video");
  v.src = CFG.bgUrl; v.autoplay = true; v.loop = true; v.muted = true; v.playsInline = true;
  v.style.filter = "blur(" + CFG.bgBlur + "px)";
  bg.appendChild(v);
} else bg.style.background = "linear-gradient(135deg," + CFG.bgColor1 + "," + CFG.bgColor2 + ")";

// profile
document.getElementById("name").textContent = CFG.name;
if (CFG.avatar) { const a = document.getElementById("avatar"); a.src = CFG.avatar; a.style.display = "inline-block"; }

// status dot next to name (filled in by lanyard)
if (CFG.lanyard && CFG.discordId) {
  const dot = document.createElement("span");
  dot.id = "status-dot";
  document.getElementById("name").appendChild(dot);
}

// bio (typewriter or plain)
const bioEl = document.getElementById("bio");
if (CFG.typewriter && CFG.bio) {
  const caret = document.createElement("span"); caret.className = "caret"; caret.innerHTML = "&nbsp;";
  let i = 0;
  (function type() {
    bioEl.textContent = CFG.bio.slice(0, i);
    bioEl.appendChild(caret);
    if (i <= CFG.bio.length) { i++; setTimeout(type, 65); }
  })();
} else bioEl.textContent = CFG.bio;

// tab title typing
if (CFG.titleType && CFG.title) {
  let ti = 0, dir = 1;
  setInterval(() => {
    ti += dir;
    if (ti >= CFG.title.length + 6) dir = -1;
    if (ti <= 0) dir = 1;
    document.title = CFG.title.slice(0, Math.max(1, Math.min(ti, CFG.title.length)));
  }, 350);
}

// link buttons
const linksEl = document.getElementById("links");
for (const l of CFG.links) {
  if (!l.url) continue;
  const a = document.createElement("a");
  a.className = "link-btn"; a.href = l.url; a.target = "_blank"; a.rel = "noopener";
  a.title = l.label;
  const ic = ICONS[l.platform] || "";
  if (CFG.btnStyle === "icons" && ic) a.innerHTML = ic;
  else a.innerHTML = ic + "<span>" + esc(l.label) + "</span>";
  linksEl.appendChild(a);
}

// audio
let audio = null;
if (CFG.audioUrl) {
  audio = new Audio(CFG.audioUrl);
  audio.loop = true;
  audio.volume = CFG.volume / 100;
  const ui = document.createElement("div");
  ui.id = "audio-ui";
  ui.innerHTML = '<button id="mute">sound on</button>' + (CFG.volSlider ? '<input type="range" id="vol" min="0" max="100" value="' + CFG.volume + '">' : '');
  document.body.appendChild(ui);
  document.getElementById("mute").onclick = function() {
    audio.muted = !audio.muted;
    this.textContent = audio.muted ? "muted" : "sound on";
  };
  const vol = document.getElementById("vol");
  if (vol) vol.oninput = () => { audio.volume = vol.value / 100; };
}

// entry screen
const enter = document.getElementById("enter");
if (CFG.enter) {
  enter.textContent = CFG.enterText || "click to enter . . .";
  enter.addEventListener("click", () => {
    enter.classList.add("hidden");
    if (audio) audio.play().catch(() => {});
  }, { once: true });
} else {
  enter.style.display = "none";
  if (audio) {
    const start = () => { audio.play().catch(() => {}); };
    document.addEventListener("click", start, { once: true });
  }
}

// tilt effect
if (CFG.tilt) {
  const card = document.getElementById("card");
  document.addEventListener("mousemove", e => {
    const x = (e.clientX / innerWidth - .5) * 14;
    const y = (e.clientY / innerHeight - .5) * -14;
    card.style.transform = "rotateY(" + x + "deg) rotateX(" + y + "deg)";
  });
}

// sparkle cursor
if (CFG.sparkle) {
  document.addEventListener("mousemove", e => {
    if (Math.random() > .35) return;
    const s = document.createElement("span");
    s.className = "sparkle"; s.textContent = "•";
    s.style.left = e.clientX + "px"; s.style.top = e.clientY + "px";
    s.style.color = CFG.accent;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 800);
  });
}

// view counter — free abacus api, no key needed.
// live visits hit /hit (count +1); the builder preview uses /get (read only).
if (CFG.views && CFG.viewsId) {
  const box = document.createElement("div");
  box.id = "views";
  box.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><span id="vc">&mdash;</span>';
  document.body.appendChild(box);
  const ns = "tickybio-" + encodeURIComponent(CFG.viewsId);
  fetch("https://abacus.jasoncameron.dev/" + (PREVIEW ? "get" : "hit") + "/" + ns + "/views")
    .then(r => r.json())
    .then(j => { document.getElementById("vc").textContent = (j.value || 0).toLocaleString(); })
    .catch(() => { box.style.display = "none"; });
}

// discord lanyard — live presence (join discord.gg/lanyard for this to work)
if (CFG.lanyard && CFG.discordId) {
  const box = document.getElementById("lanyard");
  const art = document.getElementById("ly-art");
  const l1 = document.getElementById("ly-line1");
  const l2 = document.getElementById("ly-line2");
  const colors = { online:"#3ba55d", idle:"#faa81a", dnd:"#ed4245", offline:"#747f8d" };
  async function poll() {
    try {
      const r = await fetch("https://api.lanyard.rest/v1/users/" + CFG.discordId);
      const j = await r.json();
      if (!j.success) return;
      const d = j.data;
      const dot = document.getElementById("status-dot");
      if (dot) dot.style.background = colors[d.discord_status] || colors.offline;
      if (d.listening_to_spotify && d.spotify) {
        box.style.display = "flex";
        art.style.display = "block";
        art.src = d.spotify.album_art_url;
        l1.textContent = d.spotify.song;
        l2.textContent = "listening to " + d.spotify.artist + " on spotify";
      } else {
        const act = (d.activities || []).find(a => a.type === 0);
        if (act) {
          box.style.display = "flex";
          art.style.display = "none";
          l1.textContent = "playing " + act.name;
          l2.textContent = act.details || act.state || "";
        } else box.style.display = "none";
      }
    } catch (e) {}
  }
  poll();
  setInterval(poll, 15000);
}
</script>
